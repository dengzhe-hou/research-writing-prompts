name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Rebuild generated files
        run: python tools/build.py

      - name: Generated files must be committed
        run: git diff --exit-code

      - name: Validate catalog, anchors and site data
        run: python tools/check.py

      - name: Validate evaluation cases without calling a model
        run: python eval/run.py --dry-run
